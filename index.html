body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}

button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}

.r{display:inline-block;width:10px;height:14px;background:var(--red);border-radius:2px;vertical-align:-2px}
.log{max-height:220px;overflow-y:auto;font-size:14px}

label{font-size:14px;color:var(--mut)}
.set input{width:64px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:transparent}
.end .time{color:var(--red)}

.pl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ros{margin-top:10px;font-size:14px}.ros summary{cursor:pointer;color:var(--mut);padding:6px 0}
.pr{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--bd)}
.st{color:var(--mut);font-size:12px}.x{min-height:0;padding:2px 8px}

function brandHtml(){return'<div class="brand"><span class="lg"><img src="'+LOGO+'" alt="QIHA logo"></span><div><div class="bt">Qatar Indian Handball Association</div><div class="bs">MATCH CENTRE</div><div class="bs" style="font-size:10px;opacity:.75;letter-spacing:0">'+BUILD+'</div></div><span class="flags">'+FLAGS+'</span></div>'}
function bigLogo(){return'<img class="biglogo" src="'+LOGO+'" alt="QIHA logo">'}
function evs(x,k){return(x.ev||[]).filter(function(e){return e.k==k}).map(function(e){return e.t}).join(', ')||'-'}
function repHtml(X){var s0=X.score[0],s1=X.score[1],soS=X.so?soState(X.so):null,win=s0>s1?X.names[0]:s1>s0?X.names[1]:(soS&&soS.w>=0?X.names[soS.w]:null),viaSO=(s0==s1&&soS&&soS.w>=0);
  var dt=new Date(+X.mid||Date.now()).toLocaleString();
  var h='<img src="'+LOGO+'" alt="" style="height:72px;float:right"><h1>Handball Match Report</h1><p class="rm">Qatar Indian Handball Association</p><h2>'+esc(X.mname||(X.names[0]+' vs '+X.names[1]))+'</h2><p class="rm">'+esc(dt)+'</p>'+refLine(X);
  h+='<div class="rs">'+esc(X.names[0])+' <b>'+s0+' - '+s1+'</b> '+esc(X.names[1])+'</div><p class="rw">'+(win?'Winner: <b>'+esc(win)+'</b>'+(viaSO?' (penalty shoot-out)':''):'Result: <b>Draw</b>')+'</p>';
  [0,1].forEach(function(i){
    var named=X.rs[i].reduce(function(a,x){return a+(x.g||0)},0),un=X.score[i]-named;
    h+='<h3>'+(X.lg&&X.lg[i]?'<img src="'+esc(X.lg[i])+'" style="height:22px;width:22px;border-radius:50%;vertical-align:middle;margin-right:6px">':'')+esc(X.names[i])+' ('+X.score[i]+' goals)</h3><p class="rm">Yellow cards: '+X.cd[i].y+' | Red cards: '+X.cd[i].r+' | Timeouts: '+X.to[i]+'</p>';
    h+='<table class="pt"><tr><th>No.</th><th>Player</th><th>Goals (time)</th><th>Yellow</th><th>Red</th><th>2 min</th></tr>';
    h+=X.rs[i].length?X.rs[i].map(function(x){return'<tr><td>'+esc(x.n||'-')+'</td><td>'+esc(x.name)+'</td><td>'+(x.g||0)+(x.g?' ('+evs(x,'g')+')':'')+'</td><td>'+evs(x,'y')+'</td><td>'+evs(x,'r')+'</td><td>'+evs(x,'s')+'</td></tr>'}).join(''):'<tr><td colspan="6">No players entered</td></tr>';
    h+='</table>'+(un>0?'<p class="rm">Goals without a named scorer: '+un+'</p>':'')});
  if(X.so&&X.so[0].length+X.so[1].length){var n=Math.max(X.so[0].length,X.so[1].length),cell=function(t,k){var s=X.so[t][k];if(!s)return'-';var q=X.rs[t][s.p];return(q?esc((q.n?q.n+' ':'')+q.name)+' - ':'')+(s.r?'GOAL':'missed')};
    h+='<h3>Penalty shoot-out: '+esc(X.names[0])+' '+soS.g[0]+' - '+soS.g[1]+' '+esc(X.names[1])+'</h3><table><tr><th>Shot</th><th>'+esc(X.names[0])+'</th><th>'+esc(X.names[1])+'</th></tr>';
    for(var k=0;k<n;k++)h+='<tr><td>'+(k+1)+'</td><td>'+cell(0,k)+'</td><td>'+cell(1,k)+'</td></tr>';

function renderSaved(){var e=document.getElementById('matches');if(e)e.innerHTML='<h3>Match</h3><div class="add" style="margin-top:0"><input id="mname" placeholder="Match name, e.g. Semi-final" value="'+esc(S.mname||'')+'" aria-label="Match name"><button class="pri" data-a="savem" style="min-width:0">'+(S.mid?'Update save':'Save')+'</button></div>';var f=document.getElementById('a_fin');if(f)f.innerHTML=finHtml(SV,true)}
function add(t,up){S.log.unshift({t:up?(PTUP||nowUp()):(PTIME||(PS[S.per]+' '+now()).trim()),m:t})}
function snap(){H.push(JSON.stringify(S));if(H.length>60)H.shift()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function tick(){
  if(!S.run){return}
  var n=Date.now(),d=(n-last)/1000;last=n;
  S.el+=d;
  var expd=false;for(var t=0;t<2;t++){var nx=S.sp[t].map(function(x){return{v:x.v-d,p:x.p}});nx.filter(function(x){return x.v<=0}).forEach(function(x){expd=true;spOver(t,x.p)});S.sp[t]=nx.filter(function(x){return x.v>0})}if(expd){save();render()}
  if(S.el>=plen()){S.el=plen();S.run=false;add('End of '+PN[S.per]+' ('+S.score[0]+'–'+S.score[1]+')');try{navigator.vibrate&&navigator.vibrate([400,150,400])}catch(e){}save();render();return}
  paintClock();paintSusp();
}
setInterval(tick,250);
setInterval(function(){if(S.run)saveL()},5000);

function paintClock(){var e=document.getElementById('tm');if(e)e.textContent=now()}
function paintSusp(){document.querySelectorAll('[data-sp]').forEach(function(c){var p=c.dataset.sp.split('-');var x=S.sp[p[0]][p[1]];if(x)c.textContent=chipTxt(+p[0],+p[1])})}

var PICKA=['goal','ungoal','susp','y','r','sog','som'],PEND=null,OP=[false,false];
var AL={sog:'Penalty goal by',som:'Penalty missed by',goal:'Goal scored by',ungoal:'Remove goal from',susp:'2-min suspension for',y:'Yellow card for',r:'Red card for'};
function plab(t,p){var x=S.rs[t][p];return x?(x.n?'#'+x.n+' ':'')+x.name:''}
function pl(t,p){return p>=0&&S.rs[t][p]?' – '+plab(t,p):''}
function pst(t,p,k,d){var x=S.rs[t][p];if(!x)return;x[k]=Math.max(0,(x[k]||0)+d);x.ev=x.ev||[];if(d>0)x.ev.push({k:k,t:PTUP||nowUp()});else{for(var i=x.ev.length-1;i>=0;i--)if(x.ev[i].k==k){x.ev.splice(i,1);break}}}
function evTxt(x){var m={g:'⚽',y:'🟨',s:'2′',r:'🟥'};return(x.ev&&x.ev.length)?'<div class="st">'+x.ev.map(function(e){return m[e.k]+' '+e.t}).join(' · ')+'</div>':''}
function chipTxt(t,k){var x=S.sp[t][k],q=S.rs[t][x.p];return'2′ '+(q?(q.n||q.name)+' ':'')+fmt(x.v)}
function openPick(a,t){var e=document.getElementById('pick');e.innerHTML='<div class="box"><h3>'+AL[a]+' · '+esc(S.names[t])+'</h3><div class="pl">'+S.rs[t].map(function(x,k){return'<button data-a="pick" data-p="'+k+'">'+(x.n?'<b>'+esc(x.n)+'</b> ':'')+esc(x.name)+'</button>'}).join('')+'</div><div class="row"><button data-a="pick" data-p="-1">No player</button><button data-a="cancelpick">Cancel</button></div></div>';e.hidden=false}
function closePick(){var e=document.getElementById('pick');e.hidden=true;e.innerHTML=''}
function rosterHtml(i){var r=S.rs[i];
  var h='<details class="ros"'+(OP[i]?' open':'')+' ontoggle="OP['+i+']=this.open"><summary>Players ('+r.length+')</summary>';
  h+=r.map(function(x,k){return'<div class="pr"><span><b>'+esc(x.n||'–')+'</b> '+esc(x.name)+evTxt(x)+'</span><span class="st">'+(x.g||0)+' goals'+(x.s?' · '+x.s+'×2′':'')+(x.y?' · <span class="y"></span>':'')+(x.r?' · <span class="r"></span>':'')+'</span><button class="x" data-a="rmp" data-t="'+i+'" data-k="'+k+'" aria-label="Remove player">✕</button></div>'}).join('');
  h+='<div class="add"><input data-add="'+i+'" id="pn'+i+'" placeholder="No." inputmode="numeric" maxlength="3" style="flex:0 0 64px" aria-label="Player number"><input data-add="'+i+'" id="pm'+i+'" placeholder="Player name" aria-label="Player name"><button data-a="addp" data-t="'+i+'">Add</button></div></details>';
  return h}
function render(){
  var ended=!S.run&&S.el>=plen();
  var h='<div class="per">'+PN[S.per]+' · '+S.len+(S.per<2?' min':'')+(S.per>=2?' · 5 min':'')+'</div>';
  h+='<div class="time" id="tm">'+now()+'</div><div class="row">';
  h+='<button class="'+(S.run?'':'grn')+'" data-a="run" style="'+(S.run?'':'')+'">'+(S.run?'⏸ Pause':ended?'Period over':'▶ Start')+'</button>';
  h+='<button data-a="prev"'+(S.per==0?' disabled':'')+'>◀ Prev period</button>';
  h+='<button class="pri" data-a="next">'+(S.per==1?'Penalty shoot-out ▶':'Next period ▶')+'</button></div>';
  h+='<div class="row"><button data-a="adj" data-v="-1">−1 s</button><button data-a="adj" data-v="1">+1 s</button><button data-a="adj" data-v="-10">−10 s</button><button data-a="adj" data-v="10">+10 s</button></div>';
  var c=document.getElementById('clock');c.innerHTML=h;c.className='card clock'+(ended?' end':'');if(S.per==2){c.innerHTML=soAdmin();c.className='card clock'}
  var t='';
  for(var i=0;i<2;i++){
    t+='<div class="card team">'+tav(S.lg[i])+'<input data-n="'+i+'" value="'+esc(S.names[i])+'" aria-label="Team name">'+teamSel(i);
    t+='<div class="score">'+S.score[i]+'</div><div class="g"><button class="big" data-a="goal" data-t="'+i+'">+ Goal</button>';
    t+='<button data-a="ungoal" data-t="'+i+'">− Goal</button><button data-a="susp" data-t="'+i+'">2′ Suspension</button>';
    t+='<button data-a="to" data-t="'+i+'">Timeout</button><button data-a="y" data-t="'+i+'"><span class="y"></span> Yellow</button>';
    t+='<button data-a="r" data-t="'+i+'" style="grid-column:span 2"><span class="r"></span> Red card</button></div>';
    t+='<div class="chips">'+S.sp[i].map(function(x,k){return'<button class="chip" data-a="rmsusp" data-t="'+i+'" data-k="'+k+'" data-sp="'+i+'-'+k+'">'+chipTxt(i,k)+'</button>'}).join('')+'</div>';
    t+='<div class="meta">Timeouts '+S.to[i]+'/'+S.maxto+' · <span class="y"></span> '+S.cd[i].y+' · <span class="r"></span> '+S.cd[i].r+'</div>'+rosterHtml(i)+'</div>';
  }
  document.getElementById('teams').innerHTML=t;
  document.getElementById('log').innerHTML=S.log.length?S.log.map(function(l){return'<div><b>'+l.t+'</b>'+esc(l.m)+'</div>'}).join(''):'<div>No events yet.</div>';
  document.getElementById('len').value=S.len;document.getElementById('maxto').value=S.maxto;document.getElementById('brandA').innerHTML=brandHtml();renderSaved();renderTeams();renderLiveCfg();renderPopupCfg();renderTabs();renderRefSel();renderRefsReg();
}

document.addEventListener('click',function(ev){var b=ev.target.closest('button,[data-a]');if(!b||!b.dataset.a)return;handle(b)});
function handle(b,p){
  var a=b.dataset.a,t=+b.dataset.t,nm=S.names[t];
  if(a=='cancelpick'){PEND=null;PTIME=null;PTUP=null;closePick();return}
  if(a=='gate'){showGate();return}
  if(a=='askyes'||a=='askno'){var cb=a=='askyes'?ASKCB:null;ASKCB=null;var ae=document.getElementById('ask');ae.hidden=true;ae.innerHTML='';if(cb)cb();return}
  if(a=='pdf'){var zp=findSaved(b.dataset.k);if(zp)printReport(JSON.parse(zp.data));return}
  if(a=='pdfcur'){printReport(S);return}
  if(a=='detm'){var z1=findSaved(b.dataset.k);if(z1){var de=document.getElementById('detail');de.innerHTML='<div class="box">'+detHtml(JSON.parse(z1.data))+'</div>';de.hidden=false}return}
  if(a=='detclose'){var dc=document.getElementById('detail');dc.hidden=true;dc.innerHTML='';return}
  if(a=='reset'){ask('Save this match, create its PDF report and start the next one?',function(){saveCurrent();var done=JSON.parse(JSON.stringify(S));snap();S=Object.assign(fresh(),{len:S.len,maxto:S.maxto});save();render();window.scrollTo(0,0);if(hasAct(done))printReport(done)});return}
  if(a=='gview'){gview();return}
  if(a=='gadmin'){gadmin();return}
  if(a=='atab'){ATAB=b.dataset.v;if(ATAB==='reg')REGVIEW='pending';renderTabs();if(ATAB==='reg')renderSubmissions();window.scrollTo(0,0);return}
  if(a=='copyreglink'){var ri=document.getElementById('teamRegLink');if(ri){ri.select();try{navigator.clipboard.writeText(ri.value).then(function(){alert('Registration link copied.')}).catch(function(){document.execCommand('copy')})}catch(e){document.execCommand('copy')}}return}
  if(a=='regaddplayer'){publicRegAdd();return}
  if(a=='regremove'){var rw=b.closest('.reg-player');if(rw)rw.remove();return}
  if(a=='regsubmit'){publicRegSubmit();return}
  if(a=='regapprove'){approveSubmission(b.dataset.k);return}
  if(a=='popupsave'){saveViewerPopup();return}
  if(a=='popupdisable'){disableViewerPopup();return}
  if(a=='closeviewerpopup'){closeViewerPopup();return}
  if(a=='regview'){REGVIEW=b.dataset.v;renderSubmissions();return}
  if(a=='teamopen'){var pt=TM.find(function(t){return t.id===b.dataset.k});openTeamProfile(pt);return}
  if(a=='regreject'){if(DB&&AUTHU)DB.ref('teamRegistrations/'+b.dataset.k).remove().catch(function(err){alert('Could not reject: '+err.message)});return}
  if(a=='vtab'){VTAB=b.dataset.v;renderView();window.scrollTo(0,0);return}
  if(a=='rfadd'){var rn=val('rfn').trim(),ra=val('rfa').trim(),rd=val('rfd').trim();if(rn){RF.push({id:String(Date.now()),name:rn,age:ra,description:rd,info:rd,ph:PENDRF});RFEDIT='';PENDRF='';saveRF();render()}return}
  if(a=='rfedit'){RFEDIT=b.dataset.k;renderRefsReg();return}
  if(a=='rfcancel'){RFEDIT='';PENDRF='';renderRefsReg();return}
  if(a=='rfupdate'){var ru=RF.find(function(z){return z.id==RFEDIT});if(ru){ru.name=val('rfn').trim()||ru.name;ru.age=val('rfa').trim();ru.description=val('rfd').trim();ru.info=ru.description;if(PENDRF)ru.ph=PENDRF;RFEDIT='';PENDRF='';saveRF();render()}return}
  if(a=='refopen'){var rr=RFV.concat((VS&&VS.rf)||[]).find(function(x){return x&&x.id==b.dataset.k})||RFV.find(function(x){return x&&x.name===(b.textContent||'').trim()});openRef(rr);return}
  if(a=='rfdel'){var rk=b.dataset.k;ask('Remove this referee?',function(){RF=RF.filter(function(z){return z.id!=rk});saveRF();render()});return}
  if(a=='alerts'){try{if(window.Notification&&Notification.permission=='default')Notification.requestPermission()}catch(e){}keepAwake();notify('Alerts are on. You will be alerted when a 2′ suspension ends.');return}
  if(a=='ytsave'){
    var yl=val('ytl').trim();
    if(yl){
      var parsedUrl;
      try{parsedUrl=new URL(yl)}catch(e){ytst('Please enter a valid full YouTube URL.');return}
      var host=parsedUrl.hostname.toLowerCase().replace(/^www\./,'').replace(/^m\./,'');
      if(parsedUrl.protocol!=='https:'||['youtube.com','youtu.be','youtube-nocookie.com'].indexOf(host)<0){ytst('Please use a valid HTTPS YouTube URL.');return}
    }
    if(!DB||!AUTHU){ytst('Admin is not connected to Firebase. Please sign out and sign in again.');return}
    ytst('Saving link to live match…');
    DB.ref('live/current').update({streamUrl:yl||''}).then(function(){
      LURL=yl;renderLive();
      ytst(yl?'Saved successfully. Open the viewer and select Live.':'YouTube link removed.');
    }).catch(function(err){
      ytst('Save failed: '+(err&&err.message?err.message:'Firebase denied the write. Check live/current database rules.'));
    });
    return
  }
  if(a=='ytclear'){
    if(!DB||!AUTHU){ytst('Admin is not connected to Firebase.');return}
    DB.ref('live/current').update({streamUrl:''}).then(function(){LURL='';renderLive();renderLiveCfg();ytst('YouTube link removed.')}).catch(function(err){ytst('Could not remove link: '+(err&&err.message?err.message:'check Firebase rules'))});
    return
  }
  if(a=='tmadd'){var tn=val('tmn').trim();if(tn){var nt={id:String(Date.now()),name:tn,players:[],logo:PENDLOGO};TM.push(nt);TSEL=nt.id;document.getElementById('tmn').value='';PENDLOGO='';saveTM();render()}return}
  if(a=='tmpadd'){var tt=TM.find(function(z){return z.id==b.dataset.k});if(tt){var pn=val('tpn'+tt.id).trim(),pm=val('tpm'+tt.id).trim();if(pn||pm){tt.players.push({n:pn,name:pm||('Player '+pn)});tt.players.sort(byNo);TSEL=tt.id;saveTM();render();var pf=document.getElementById('tpn'+tt.id);if(pf)pf.focus()}}return}
  if(a=='tmprm'){var tk=b.dataset.k,pk=+b.dataset.p;ask('Remove this player from the team?',function(){var t2=TM.find(function(z){return z.id==tk});if(t2){t2.players.splice(pk,1);saveTM();render()}});return}
  if(a=='tmdel'){var dk2=b.dataset.k;ask('Delete this registered team?',function(){TM=TM.filter(function(z){return z.id!=dk2});saveTM();render()});return}
  if(a=='dologin'){dologin();return}
  if(a=='dosetup'){dosetup();return}
  if(a=='resetlogin'){resetlogin();return}
  if(a=='chpw'){try{firebase.auth().signOut()}catch(e){}AUTHU=null;showGate();return}
  if(a=='dochange'){dochange();return}
  if(a=='savem'){var mn=(S.mname||'').trim()||(S.names[0]+' vs '+S.names[1]);S.mname=mn;if(!S.mid)S.mid=String(Date.now());var en={id:S.mid,name:mn,ts:Date.now(),sc:scTxt(),data:JSON.stringify(S)};var ix=SV.findIndex(function(z){return z.id==S.mid});if(ix>=0)SV[ix]=en;else SV.unshift(en);saveSV();save();render();return}
  if(a=='loadm'){var e1=SV.find(function(z){return z.id==b.dataset.k});if(e1){ask('Continue this match? The current match will be saved first.',function(){saveCurrent();snap();S=Object.assign(fresh(),JSON.parse(e1.data));S.run=false;S.mid=e1.id;save();render();window.scrollTo(0,0)})}return}
  if(a=='delm'){var dk=b.dataset.k;ask('Delete this saved match?',function(){SV=SV.filter(function(z){return z.id!=dk});saveSV();render()});return}
  if(a=='pick'){var pb=PEND;PEND=null;closePick();if(pb)handle(pb,+b.dataset.p);PTIME=null;PTUP=null;return}
  if(a=='addp'){var nn=document.getElementById('pn'+t).value.trim(),w=document.getElementById('pm'+t).value.trim();if(!nn&&!w)return;S.rs[t].push({n:nn,name:w||('Player '+nn),g:0,y:0,r:0,s:0,ev:[]});S.rs[t].sort(function(a,b){return(a.n===''?999:+a.n)-(b.n===''?999:+b.n)});OP[t]=true;save();render();var f=document.getElementById('pn'+t);if(f)f.focus();return}
  if(a=='addp'){var inp=document.getElementById('pm'+t);inp.value.split(/[,;\n]+/).forEach(function(s){s=s.trim();if(!s)return;var m=s.match(/^(\d{1,3})[\s.\-#]*(.*)$/);var n=m?m[1]:'',w=m?m[2].trim():s;S.rs[t].push({n:n,name:w||('Player '+n),g:0,y:0,r:0,s:0})});S.rs[t].sort(function(a,b){return(a.n===''?999:+a.n)-(b.n===''?999:+b.n)});OP[t]=true;save();render();return}
  if(a=='rmp'){var rk=+b.dataset.k,rt=t;ask('Remove this player?',function(){S.rs[rt].splice(rk,1);save();render()});return}
  if(PICKA.indexOf(a)>=0){if(p===undefined&&S.rs[t].length){PEND=b;PTIME=PS[S.per]+' '+now();PTUP=nowUp();openPick(a,t);return}if(p===undefined)p=-1}
  if(a=='theme'){var r=document.documentElement;var dark=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';return}
  if(a=='undo'){if(H.length){S=JSON.parse(H.pop());S.run=false;save();render()}return}
  if(a=='reset'){if(confirm('Start a new match? This clears score, clock and log.')){snap();S=Object.assign(fresh(),{len:S.len,maxto:S.maxto,names:S.names,rs:S.rs.map(function(r){return r.map(function(x){return{n:x.n,name:x.name,g:0,y:0,r:0,s:0}})})});save();render()}return}
  snap();
  if(a=='run'){if(S.el>=plen()&&!S.run){H.pop();return}S.run=!S.run;last=Date.now();if(S.run)keepAwake();add(S.run?'Clock started':'Clock paused')}
  else if(a=='next'){S.per++;S.el=0;S.run=false;S.sp=[[],[]];add('Start of '+PN[S.per]+' (ready)')}
  else if(a=='prev'){S.per--;S.el=(S.per==1?plen():0);S.run=false;add('Back to '+PN[S.per])}
  else if(a=='adj'){S.el=Math.min(plen(),Math.max(0,S.el-(+b.dataset.v)));add('Clock adjusted '+b.dataset.v+' s')}
  else if(a=='sog'||a=='som'){S.so[t].push({r:a=='sog'?1:0,p:p});var s2=soState(S.so);add('Shoot-out '+(a=='sog'?'GOAL':'MISSED')+' '+nm+pl(t,p)+' ('+s2.g[0]+'-'+s2.g[1]+')');if(s2.w>=0)add('Shoot-out won by '+S.names[s2.w])}
  else if(a=='goal'){S.score[t]++;pst(t,p,'g',1);add('GOAL '+nm+pl(t,p)+' ('+S.score[0]+'–'+S.score[1]+')',1)}
  else if(a=='ungoal'){if(S.score[t]>0){S.score[t]--;pst(t,p,'g',-1);add('Goal removed '+nm+pl(t,p)+' ('+S.score[0]+'–'+S.score[1]+')',1)}else H.pop()}
  else if(a=='susp'){S.sp[t].push({v:120,p:p});pst(t,p,'s',1);add('2-min suspension '+nm+pl(t,p),1)}
  else if(a=='rmsusp'){S.sp[t].splice(+b.dataset.k,1);add('Suspension cleared '+nm)}
  else if(a=='to'){S.to[t]++;S.run=false;add('Team timeout '+nm+' ('+S.to[t]+'/'+S.maxto+')')}
  else if(a=='y'){S.cd[t].y++;pst(t,p,'y',1);add('Yellow card '+nm+pl(t,p),1)}
  else if(a=='r'){S.cd[t].r++;pst(t,p,'r',1);add('Red card '+nm+pl(t,p),1)}
  save();render();
}
document.addEventListener('input',function(ev){
  var e=ev.target;
  if(e.dataset.n!=null){S.names[+e.dataset.n]=e.value;save()}
  else if(e.id=='mname'){S.mname=e.value;save()}else if(e.id=='len'){var v=Math.max(1,Math.min(60,+e.value||30));S.len=v;save();paintClock()}
  else if(e.id=='maxto'){S.maxto=Math.max(1,Math.min(5,+e.value||3));save()}
});
document.addEventListener('change',function(ev){if(ev.target.id=='len'||ev.target.id=='maxto')render()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&MODE==='view')closeViewerPopup();if(ev.key=='Enter'&&ev.target.dataset&&ev.target.dataset.add!=null){var bb=document.querySelector('button[data-a=addp][data-t="'+ev.target.dataset.add+'"]');if(bb)bb.click()}});
init();if(new URLSearchParams(location.search).get('register')==='1'){MODE='register';REGPLAYERCOUNT=5;renderPublicRegistration()}else{render();showGate()}
</script>
